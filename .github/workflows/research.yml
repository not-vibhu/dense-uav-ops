name: Research checks
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[learning,archive]'
      - name: Build the DAIDALUS bridge (fetches NASA DAIDALUS at the pinned revision)
        run: python scripts/build_daidalus.py
      - run: python -m unittest discover -s tests -v
      - name: Validate every evidence set against the source that produced it
        run: python scripts/validate_evidence.py
