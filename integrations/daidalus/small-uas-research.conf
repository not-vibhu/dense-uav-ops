# dense-uav-ops research configuration for DAIDALUS (MIT license, this repository).
#
# These thresholds are research assumptions for small UAS at tens of metres of
# separation. They are NOT a published well-clear definition, a DO-365 or ASTM
# F3442 profile, or an approved operating minimum. Parameters not listed keep
# DAIDALUS defaults. Sensor uncertainty mitigation is disabled because this
# simulator declares hard error bounds, not Gaussian standard deviations.

# Bands
lookahead_time = 20.0 [s]
left_hdir = 180.0 [deg]
right_hdir = 180.0 [deg]
min_hs = 0.0 [m/s]
max_hs = 20.0 [m/s]
min_vs = -5.0 [m/s]
max_vs = 5.0 [m/s]
min_alt = 0.0 [m]
max_alt = 1000.0 [m]

# Kinematics of the ownship used to build kinematic bands
step_hdir = 2.0 [deg]
step_hs = 0.5 [m/s]
step_vs = 0.5 [m/s]
step_alt = 2.0 [m]
horizontal_accel = 4.0 [m/s^2]
vertical_accel = 0.2 [G]
turn_rate = 35.0 [deg/s]
bank_angle = 0.0 [deg]
vertical_rate = 3.0 [m/s]

# Recovery and collision-avoidance bands
min_horizontal_recovery = 10.0 [m]
min_vertical_recovery = 5.0 [m]
recovery_hdir = true
recovery_hs = true
recovery_vs = true
recovery_alt = true
ca_bands = true
ca_factor = 0.1
horizontal_nmac = 3.0 [m]
vertical_nmac = 3.0 [m]

# Hysteresis and persistence scaled to small-UAS time constants
recovery_stability_time = 1.0 [s]
hysteresis_time = 2.0 [s]
persistence_time = 1.0 [s]
bands_persistence = true
alerting_m = 1
alerting_n = 1

# No Gaussian sensor-uncertainty mitigation
h_pos_z_score = 0.0
h_vel_z_score_min = 0.0
h_vel_z_score_max = 0.0
v_pos_z_score = 0.0
v_vel_z_score = 0.0

# Alerting: one alerter, tau-modified well-clear with small-UAS distances
ownship_centric_alerting = false
corrective_region = MID
alerters = sUAS_research
sUAS_research_alert_1_region = NONE
sUAS_research_alert_1_alerting_time = 15.0 [s]
sUAS_research_alert_1_early_alerting_time = 20.0 [s]
sUAS_research_alert_1_detector = det_1
sUAS_research_det_1_WCV_DTHR = 15.0 [m]
sUAS_research_det_1_WCV_ZTHR = 10.0 [m]
sUAS_research_det_1_WCV_TTHR = 3.0 [s]
sUAS_research_det_1_WCV_TCOA = 0.0 [s]
sUAS_research_load_core_detection_det_1 = gov.nasa.larcfm.ACCoRD.WCV_TAUMOD
sUAS_research_alert_2_region = MID
sUAS_research_alert_2_alerting_time = 10.0 [s]
sUAS_research_alert_2_early_alerting_time = 15.0 [s]
sUAS_research_alert_2_detector = det_2
sUAS_research_det_2_WCV_DTHR = 15.0 [m]
sUAS_research_det_2_WCV_ZTHR = 10.0 [m]
sUAS_research_det_2_WCV_TTHR = 3.0 [s]
sUAS_research_det_2_WCV_TCOA = 0.0 [s]
sUAS_research_load_core_detection_det_2 = gov.nasa.larcfm.ACCoRD.WCV_TAUMOD
sUAS_research_alert_3_region = NEAR
sUAS_research_alert_3_alerting_time = 5.0 [s]
sUAS_research_alert_3_early_alerting_time = 10.0 [s]
sUAS_research_alert_3_detector = det_3
sUAS_research_det_3_WCV_DTHR = 10.0 [m]
sUAS_research_det_3_WCV_ZTHR = 8.0 [m]
sUAS_research_det_3_WCV_TTHR = 2.0 [s]
sUAS_research_det_3_WCV_TCOA = 0.0 [s]
sUAS_research_load_core_detection_det_3 = gov.nasa.larcfm.ACCoRD.WCV_TAUMOD
