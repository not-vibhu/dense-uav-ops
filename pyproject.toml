[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-uav-ops"
version = "0.3.0"
description = "Reproducible mixed-equipage UAS simulation and safety comparison"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/not-vibhu/dense-uav-ops"

[project.optional-dependencies]
learning = ["torch>=2.6,<3"]

[project.scripts]
swarm-sim = "swarm_sim.cli:main"
airspace-capacity = "airspace_capacity.__main__:main"

[tool.setuptools]
packages = ["swarm_sim", "airspace_capacity"]

[tool.setuptools.package-data]
swarm_sim = ["web/*.html", "web/*.js", "web/*.css"]
airspace_capacity = ["web/*.html", "web/*.js", "web/*.css"]
