[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-uav-ops"
version = "0.5.0"
description = "Research simulator for the safety–capacity frontier of dense, mixed-equipage UAS traffic"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vibhu Tripathi" }]
keywords = ["UAS", "UTM", "tactical deconfliction", "airspace capacity", "simulation", "DAIDALUS"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
learning = ["torch>=2.6,<3"]
analysis = ["matplotlib>=3.8,<4"]
# Needed only to validate archived evidence from v0.4 (signed audit records).
archive = ["cryptography>=43,<48"]

[project.urls]
Repository = "https://github.com/not-vibhu/dense-uav-ops"

[project.scripts]
dense-uav-ops = "dense_uav_ops.__main__:main"

[tool.setuptools.packages.find]
include = ["dense_uav_ops*"]
