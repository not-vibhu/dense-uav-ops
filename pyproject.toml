[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-swarm-sim"
version = "0.2.0"
description = "Reproducible mixed-equipage UAS simulation and safety comparison"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]
license = {text = "MIT"}

[project.scripts]
swarm-sim = "swarm_sim.cli:main"

[tool.setuptools]
packages = ["swarm_sim"]

[tool.setuptools.package-data]
swarm_sim = ["web/*.html", "web/*.js", "web/*.css"]
